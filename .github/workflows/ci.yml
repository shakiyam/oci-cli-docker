name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run make format
        run: make format
      - name: Run check_for_file_updates.sh
        run: ./tools/check_for_file_updates.sh
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run make --keep-going lint
        run: make --keep-going lint
        env:
          GH_TOKEN: ${{ github.token }}
  pip_licenses:
    name: pip-licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          no-cache: true
          tags: ghcr.io/shakiyam/oci-cli:latest
      - name: Run make pip_licenses
        run: make pip_licenses
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          no-cache: true
          tags: ghcr.io/shakiyam/oci-cli:latest
          cache-to: type=gha,scope=ci-${{ github.run_id }},mode=max
      - name: Run make test
        run: make test
  build:
    name: Build and Push
    permissions:
      contents: read
      packages: write # Push images to GitHub Container Registry
    needs: [format, lint, pip_licenses, test]
    if: github.event_name == 'push'
    environment: docker-hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64, linux/arm64
          push: true
          cache-from: type=gha,scope=ci-${{ github.run_id }}
          tags: |
            docker.io/shakiyam/oci-cli:latest
            ghcr.io/shakiyam/oci-cli:latest
